name: Release

# Triggered by pushes to `master` and `release/**` branches, and by the
# manual `workflow_dispatch` button. Version comes from `Cargo.toml`'s
# `[workspace.package].version` -- bump that before merging to master to
# produce a new numbered release. Each push to master creates (or
# re-creates) the GitHub Release for that version tag.
on:
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------
  # Resolve the version string ONCE so every platform job uses the
  # same value. Only the base X.Y.Z from Cargo.toml is used -- no
  # run-number suffix. Artifact files and the GitHub Release tag all
  # use this plain semver so the release page stays clean.
  # --------------------------------------------------------------
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${BASE}"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bar-editor-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bar-editor-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bar-editor-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bar-editor-macos-aarch64
    env:
      VERSION: ${{ needs.version.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      # --- Linux: portable tarball + AppImage + .deb ---
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bar-editor dist/
          cp target/${{ matrix.target }}/release/bar-cli dist/

          # Portable tarball
          cd dist && tar czf "../${{ matrix.artifact }}-${VERSION}.tar.gz" * && cd ..

          # AppImage (build-appimage.sh reads $VERSION for naming)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          export PATH="$PWD:$PATH"
          ./installer/linux/build-appimage.sh dist .

          # .deb package
          DEB_DIR=deb-pkg
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          cp dist/bar-editor "$DEB_DIR/usr/bin/"
          cp dist/bar-cli "$DEB_DIR/usr/bin/"
          cp installer/linux/bar-editor.desktop "$DEB_DIR/usr/share/applications/"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: bar-editor
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libxkbcommon0, libwayland-client0
          Maintainer: bar-editor Contributors
          Description: BAR - Map Editor
           Standalone map editor for Beyond All Reason (Spring/Recoil engine).
           Procedural generation, sculpting, mapinfo editing, validation, and
           SD7 packaging in a single application.
          EOF
          dpkg-deb --build "$DEB_DIR" "bar-editor_${VERSION}_amd64.deb"

      # --- Windows: NSIS installer + portable zip ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bar-editor.exe dist/
          Copy-Item target/${{ matrix.target }}/release/bar-cli.exe dist/

          # Portable zip
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}-${env:VERSION}.zip"

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer/windows.nsi
          arguments: /DVERSION=${env:VERSION}
        env:
          VERSION: ${{ needs.version.outputs.base }}

      # --- macOS: portable tarball + .app bundle + .dmg ---
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bar-editor dist/
          cp target/${{ matrix.target }}/release/bar-cli dist/

          # Portable tarball
          cd dist && tar czf "../${{ matrix.artifact }}-${VERSION}.tar.gz" * && cd ..

          # .app bundle
          APP_DIR="dist/BAR Map Editor.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          mkdir -p "dist/BAR Map Editor.app/Contents/Resources"
          cp target/${{ matrix.target }}/release/bar-editor "$APP_DIR/"
          cp target/${{ matrix.target }}/release/bar-cli "$APP_DIR/"

          cat > "dist/BAR Map Editor.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>bar-editor</string>
            <key>CFBundleIdentifier</key><string>com.barmapeditor.app</string>
            <key>CFBundleName</key><string>BAR Map Editor</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

          # .dmg packaging the .app + the portable tarball.
          hdiutil create -volname "BAR Map Editor" -srcfolder dist -ov -format UDZO \
            "${{ matrix.artifact }}-${VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
            *.AppImage
            *.deb
            *.dmg
            **/*Setup.exe

  # --------------------------------------------------------------
  # Create (or update) the GitHub Release for this version tag and
  # attach all platform artifacts as downloadable assets.
  # Only runs on master -- release/** builds artifacts but doesn't
  # publish, so you can iterate on the branch before the final merge.
  # --------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.base }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Guard against duplicate tag
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists -- bump Cargo.toml version before merging to master"
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            artifacts/*
