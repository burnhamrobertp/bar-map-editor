name: Release

# Triggered by pushes to `master` (every release commit) and by the
# manual `workflow_dispatch` button so the pipeline can be exercised
# from any branch while still in development. No git tags are
# required — the version comes from `Cargo.toml`'s
# `[workspace.package].version` plus the GitHub run number, so each
# successful build produces a uniquely-versioned artifact set.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------
  # Resolve the semver string ONCE so every platform job uses the
  # same value. The base (X.Y.Z) is read from Cargo.toml; the build
  # suffix is the GitHub run number, which monotonically increases
  # per workflow invocation. Three flavours are emitted:
  #
  #   base       -> "0.1.0"            for tools that demand strict 3-part semver
  #                                    (NSIS, .app CFBundleShortVersionString)
  #   semver     -> "0.1.0+build42"    canonical semver with build metadata
  #   filename   -> "0.1.0-build42"    filesystem-friendly form for artifact names
  # --------------------------------------------------------------
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.base }}
      semver: ${{ steps.v.outputs.semver }}
      filename: ${{ steps.v.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          # Workspace-level version lives under `[workspace.package]`
          # in the root Cargo.toml; -m1 grabs the first `version =`
          # which is exactly that.
          BASE=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=${{ github.run_number }}
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "semver=${BASE}+build${BUILD}" >> "$GITHUB_OUTPUT"
          echo "filename=${BASE}-build${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: base=${BASE} build=${BUILD}"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bar-editor-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bar-editor-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bar-editor-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bar-editor-macos-aarch64
    env:
      VERSION_BASE: ${{ needs.version.outputs.base }}
      VERSION_SEMVER: ${{ needs.version.outputs.semver }}
      VERSION_FILENAME: ${{ needs.version.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      # --- Linux: portable tarball + AppImage + .deb ---
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bar-editor dist/
          cp target/${{ matrix.target }}/release/bar-cli dist/

          # Portable tarball
          cd dist && tar czf "../${{ matrix.artifact }}-${VERSION_FILENAME}.tar.gz" * && cd ..

          # AppImage (build-appimage.sh reads $VERSION for naming)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          export PATH="$PWD:$PATH"
          VERSION="${VERSION_FILENAME}" ./installer/linux/build-appimage.sh dist .

          # .deb package
          DEB_DIR=deb-pkg
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          cp dist/bar-editor "$DEB_DIR/usr/bin/"
          cp dist/bar-cli "$DEB_DIR/usr/bin/"
          cp installer/linux/bar-editor.desktop "$DEB_DIR/usr/share/applications/"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: bar-editor
          Version: ${VERSION_SEMVER}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libxkbcommon0, libwayland-client0
          Maintainer: bar-editor Contributors
          Description: BAR - Map Editor
           Standalone map editor for Beyond All Reason (Spring/Recoil engine).
           Procedural generation, sculpting, mapinfo editing, validation, and
           SD7 packaging in a single application.
          EOF
          dpkg-deb --build "$DEB_DIR" "bar-editor_${VERSION_FILENAME}_amd64.deb"

      # --- Windows: NSIS installer + portable zip ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bar-editor.exe dist/
          Copy-Item target/${{ matrix.target }}/release/bar-cli.exe dist/

          # Portable zip
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}-${env:VERSION_FILENAME}.zip"

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer/windows.nsi
          arguments: /DVERSION=${env:VERSION_BASE}
        env:
          VERSION_BASE: ${{ needs.version.outputs.base }}

      # --- macOS: portable tarball + .app bundle + .dmg ---
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bar-editor dist/
          cp target/${{ matrix.target }}/release/bar-cli dist/

          # Portable tarball
          cd dist && tar czf "../${{ matrix.artifact }}-${VERSION_FILENAME}.tar.gz" * && cd ..

          # .app bundle. CFBundleShortVersionString must be plain
          # X.Y.Z, so we use $VERSION_BASE there. Internal app name
          # is "BAR Map Editor"; CFBundleExecutable matches the
          # binary name on disk.
          APP_DIR="dist/BAR Map Editor.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          mkdir -p "dist/BAR Map Editor.app/Contents/Resources"
          cp target/${{ matrix.target }}/release/bar-editor "$APP_DIR/"
          cp target/${{ matrix.target }}/release/bar-cli "$APP_DIR/"

          cat > "dist/BAR Map Editor.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>bar-editor</string>
            <key>CFBundleIdentifier</key><string>com.barmapeditor.app</string>
            <key>CFBundleName</key><string>BAR Map Editor</string>
            <key>CFBundleVersion</key><string>${VERSION_BASE}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION_BASE}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

          # .dmg packaging the .app + the portable tarball.
          hdiutil create -volname "BAR Map Editor" -srcfolder dist -ov -format UDZO \
            "${{ matrix.artifact }}-${VERSION_FILENAME}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Glob patterns are evaluated against GITHUB_WORKSPACE; the
          # NSIS OutFile lands wherever makensis was invoked from
          # (varies between actions versions), so we catch any
          # `*Setup.exe` anywhere in the tree.
          path: |
            *.tar.gz
            *.zip
            *.AppImage
            *.deb
            *.dmg
            **/*Setup.exe
